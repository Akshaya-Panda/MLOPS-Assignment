apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiorisk-api
  namespace: cardiorisk
  labels:
    app.kubernetes.io/name: cardiorisk-api
    app.kubernetes.io/component: model-server
    app.kubernetes.io/part-of: cardiorisk
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # zero-downtime: a new pod must be Ready before an old one stops
  selector:
    matchLabels:
      app.kubernetes.io/name: cardiorisk-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cardiorisk-api
        app.kubernetes.io/part-of: cardiorisk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Published by the CI pipeline after lint, tests, training and the smoke test.
          # Pin a specific build with:  kubectl -n cardiorisk set image deploy/cardiorisk-api api=<image>:<sha7>
          image: ghcr.io/akshaya-panda/mlops-assignment:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cardiorisk-api-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
